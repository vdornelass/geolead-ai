<template>
    <lightning-card title="To-Do List" icon-name="standard:task" class="todo-main-card">
        <!-- Ações do Cabeçalho -->
        <div slot="actions">
            <lightning-button-icon 
                icon-name="utility:refresh" 
                alternative-text="Recarregar Tarefas" 
                title="Atualizar"
                onclick={handleRefresh}
                variant="border-filled">
            </lightning-button-icon>
        </div>

        <!-- Spinner de Carregamento -->
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Carregando..." size="medium"></lightning-spinner>
        </template>

        <div class="slds-p-around_medium">
            <!-- Painel de Progresso e Métricas -->
            <div class="slds-box slds-theme_shade slds-m-bottom_medium metric-box">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                    <div class="metric-item">
                        <span class="slds-text-title_bold slds-text-color_weak">Total</span>
                        <span class="metric-number">{totalCount}</span>
                    </div>
                    <div class="metric-divider"></div>
                    <div class="metric-item">
                        <span class="slds-text-title_bold slds-text-color_weak">Pendentes</span>
                        <span class="metric-number slds-text-color_error">{pendingCount}</span>
                    </div>
                    <div class="metric-divider"></div>
                    <div class="metric-item">
                        <span class="slds-text-title_bold slds-text-color_weak">Concluídas</span>
                        <span class="metric-number slds-text-color_success">{completedCount}</span>
                    </div>
                    <div class="metric-divider"></div>
                    <div class="metric-item">
                        <span class="slds-text-title_bold slds-text-color_weak">Progresso</span>
                        <span class="metric-number">{completionPercentage}%</span>
                    </div>
                </div>
                <lightning-progress-bar value={completionPercentage} size="medium" variant="circular"></lightning-progress-bar>
            </div>

            <!-- Formulário para Adicionar Nova Tarefa -->
            <div class="slds-box slds-m-bottom_medium add-task-card">
                <div class="slds-text-title_caps slds-m-bottom_x-small form-header">
                    <lightning-icon icon-name="utility:new" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                    Nova Tarefa
                </div>
                <div class="slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-end">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12 slds-m-bottom_x-small">
                        <lightning-input 
                            type="text" 
                            label="Título da Tarefa" 
                            placeholder="Ex: Revisar código do Pull Request..." 
                            value={newTitle}
                            onchange={handleNewTitleChange}
                            onkeyup={handleKeyUp}
                            class="task-input-title"
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                        <lightning-combobox
                            name="priority"
                            label="Prioridade"
                            value={newPriority}
                            placeholder="Prioridade"
                            options={priorityOptions}
                            onchange={handleNewPriorityChange}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12 slds-m-bottom_x-small">
                        <lightning-input 
                            type="date" 
                            label="Data Vencimento" 
                            value={newDueDate}
                            onchange={handleNewDueDateChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12 slds-m-bottom_x-small">
                        <lightning-button 
                            label="Adicionar" 
                            variant="brand" 
                            icon-name="utility:add"
                            class="slds-size_1-of-1"
                            onclick={handleAddTask}
                            disabled={isAddDisabled}>
                        </lightning-button>
                    </div>
                </div>
            </div>

            <!-- Barra de Filtros e Busca -->
            <div class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small search-filter-row">
                <!-- Abas de Filtro -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                    <lightning-button-group>
                        <lightning-button 
                            label={allFilterLabel} 
                            variant={allButtonVariant} 
                            onclick={handleFilterAll}>
                        </lightning-button>
                        <lightning-button 
                            label={pendingFilterLabel} 
                            variant={pendingButtonVariant} 
                            onclick={handleFilterPending}>
                        </lightning-button>
                        <lightning-button 
                            label={completedFilterLabel} 
                            variant={completedButtonVariant} 
                            onclick={handleFilterCompleted}>
                        </lightning-button>
                    </lightning-button-group>
                </div>

                <!-- Campo de Busca -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12 slds-m-bottom_x-small">
                    <lightning-input 
                        type="search" 
                        variant="label-hidden" 
                        placeholder="Pesquisar por título..." 
                        value={searchTerm}
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>
            </div>

            <!-- Lista de Tarefas -->
            <template lwc:if={hasTasks}>
                <ul class="slds-has-dividers_around-space task-list-container">
                    <template for:each={filteredTasks} for:item="item">
                        <c-to-do-item 
                            key={item.Id} 
                            task={item}
                            ontoggle={handleToggleTask}
                            onupdate={handleUpdateTask}
                            ondelete={handleDeleteTask}>
                        </c-to-do-item>
                    </template>
                </ul>
            </template>

            <!-- Estado Vazio (Empty State) -->
            <template lwc:else>
                <div class="slds-illustration slds-illustration_small slds-p-around_large empty-state-box">
                    <div class="slds-text-longform slds-text-align_center">
                        <lightning-icon 
                            icon-name="utility:task" 
                            size="large" 
                            class="slds-m-bottom_small empty-icon">
                        </lightning-icon>
                        <h3 class="slds-text-heading_medium slds-text-color_weak">{emptyStateTitle}</h3>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-top_xx-small">
                            {emptyStateSubtitle}
                        </p>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
